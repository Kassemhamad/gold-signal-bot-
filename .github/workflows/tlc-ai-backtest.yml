name: Gold historical strategy backtests
on:
  push:
    branches: [feature/tlc-ai-review]
    paths: [ 'tlc_ai/**', '.github/workflows/tlc-ai-backtest.yml' ]
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing TLC trend liquidity test
        working-directory: tlc_ai
        run: python run_public_data.py
      - name: New York open 1R candle test
        working-directory: tlc_ai
        run: python ny_open_backtest.py
      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: gold-strategy-backtests
          path: |
            tlc_ai/tlc_ai_results.json
            tlc_ai/ny_open_results.json
