name: Lebanese M5 Funded Research
on:
  push:
    paths:
      - '.github/workflows/lebanese_m5_research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    strategy:
      matrix:
        capital: [100, 1000]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run research only
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          BACKTEST_DAYS: '365'
          START_BALANCE: ${{ matrix.capital }}
        run: python cent_rsi7_m5_lebanese_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lebanese-capital-${{ matrix.capital }}-report
          path: |
            cent_rsi7_m5_lebanese_monthly.csv
            cent_rsi7_m5_lebanese_trades.csv
            cent_rsi7_m5_lebanese_cycles.csv
            cent_rsi7_m5_lebanese_monthly_wins_failures.csv
            cent_rsi7_m5_lebanese_summary.txt
