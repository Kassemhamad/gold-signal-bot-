name: NY Gold 5m Backtest
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Past calendar days to test (30-180)'
        required: true
        default: '90'
      start:
        description: 'New York entry window start'
        required: true
        default: '08:30'
      end:
        description: 'New York entry window end'
        required: true
        default: '09:30'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run read-only backtest
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          BACKTEST_DAYS: ${{ inputs.days }}
          BACKTEST_START: ${{ inputs.start }}
          BACKTEST_END: ${{ inputs.end }}
        run: python ny_gold_5m_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ny-gold-5m-backtest-results
          path: |
            ny_gold_5m_trades.csv
            ny_gold_5m_summary.txt
