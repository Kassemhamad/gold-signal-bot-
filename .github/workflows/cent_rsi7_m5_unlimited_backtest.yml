name: Cent RSI7 M5 Unlimited Research
on:
  push:
    paths:
      - '.github/workflows/cent_rsi7_m5_unlimited_backtest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Backtest only (never places trades)
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          BACKTEST_DAYS: '365'
          SIM_LEVERAGE: '20'
          OZ_PER_CENT_LOT: '1'
        run: python cent_rsi7_m5_unlimited_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cent-rsi7-m5-unlimited-research
          path: |
            cent_rsi7_m5_unlimited_monthly.csv
            cent_rsi7_m5_unlimited_trades.csv
            cent_rsi7_m5_unlimited_summary.txt
            cent_rsi7_m5_unlimited_cycles.csv
            cent_rsi7_m5_unlimited_attempt_distribution.csv
