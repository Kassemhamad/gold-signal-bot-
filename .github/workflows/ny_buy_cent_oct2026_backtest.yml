name: October Gold Buy Cent Doubling Backtest
on:
  push:
    paths:
      - 'ny_buy_cent_oct2026_backtest.py'
      - '.github/workflows/ny_buy_cent_oct2026_backtest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP client
        run: pip install requests
      - name: Backtest October 2026 (read-only, no orders)
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          OZ_PER_CENT_LOT: '1'
        run: python ny_buy_cent_oct2026_backtest.py
      - name: Upload trade ledger and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: october-gold-buy-cent-doubling-results
          path: |
            ny_buy_cent_oct2026_trades.csv
            ny_buy_cent_oct2026_summary.json
