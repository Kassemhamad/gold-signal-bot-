name: Cent RSI7 $1000 Hedge Backtest
on:
  push:
    paths:
      - '.github/workflows/cent_rsi7_1000_hedged_backtest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Backtest only (never places trades)
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          BACKTEST_DAYS: '365'
          SIM_LEVERAGE: '20'
          OZ_PER_CENT_LOT: '1'
        run: python cent_rsi7_1000_hedged_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cent-rsi7-1000-hedge-monthly-statement
          path: |
            cent_rsi7_1000_monthly.csv
            cent_rsi7_1000_trades.csv
            cent_rsi7_1000_summary.txt
