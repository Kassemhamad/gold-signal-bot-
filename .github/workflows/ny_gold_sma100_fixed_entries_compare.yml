name: NY Gold SMA100 Matched Entry Reverse Compare
on:
  workflow_dispatch:
    inputs:
      days:
        description: Calendar days to backtest
        default: '90'
        required: true
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run paired historical test
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          BACKTEST_DAYS: ${{ inputs.days }}
          BACKTEST_START: '09:30'
          BACKTEST_END: '16:00'
        run: python ny_gold_sma100_fixed_entries_compare.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ny-gold-sma100-matched-reverse-results
          path: |
            ny_gold_sma100_fixed_entries_compare.csv
            ny_gold_sma100_fixed_entries_compare_summary.txt
