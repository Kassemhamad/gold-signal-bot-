name: Reversed Previous NY Session Breakout 365 Days
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas numpy
      - name: Download 365 days M1 bid ask
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          DAYS: '365'
        run: python export_gold_history.py
      - name: Backtest reverse previous NY session breakout
        run: python reversed_prev_ny_session_breakout_365.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reversed-prev-ny-session-365-results
          path: |
            reversed_prev_ny_session_breakout_365_trades.csv
            reversed_prev_ny_session_breakout_365_summary.txt
