name: HA Doji Five Wins One Year
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas numpy
      - name: Export 365 day gold bid ask history
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          DAYS: '365'
        run: python export_gold_history.py
      - name: Unchanged 5m HA doji setup and five-win compounding
        run: python ha_doji_one_year.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ha-doji-one-year-results
          path: |
            ha_doji_one_year_trades.csv
            ha_doji_one_year_summary.txt
