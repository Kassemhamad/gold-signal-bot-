name: Gold Signal Bot

on:
  schedule:
    # Every 5 minutes, 13:00-20:00 UTC, Monday-Friday
    - cron: '*/5 13-20 * * 1-5'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send test message (skip market hours check)'
        required: false
        default: 'false'

jobs:
  check-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run signal check
        env:
          OANDA_API_TOKEN:   ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID:  ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENV:         ${{ secrets.OANDA_ENV }}
          OANDA_INSTRUMENT:  ${{ secrets.OANDA_INSTRUMENT }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE:         ${{ github.event.inputs.test_mode }}
        run: python signal_check.py
