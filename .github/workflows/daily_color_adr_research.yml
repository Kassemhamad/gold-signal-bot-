name: Daily Candle ADR Reversal Research
on:
  push:
    paths:
      - '.github/workflows/daily_color_adr_research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    strategy:
      matrix:
        capital: [100, 1000]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Simulation only
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          START_BALANCE: ${{ matrix.capital }}
        run: python daily_color_adr_reversal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-color-adr-capital-${{ matrix.capital }}
          path: |
            daily_color_adr_summary.txt
            daily_color_adr_monthly.csv
            daily_color_adr_trades.csv
