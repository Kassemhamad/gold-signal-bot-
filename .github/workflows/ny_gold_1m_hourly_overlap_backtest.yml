name: NY Gold 1m Hourly Overlapping
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Historical calendar days'
        required: true
        default: '90'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run read-only New York session backtest
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          BACKTEST_DAYS: ${{ inputs.days }}
          BACKTEST_START: '09:30'
          BACKTEST_END: '16:00'
        run: python ny_gold_1m_hourly_overlap_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ny-gold-hourly-overlap-results
          path: |
            ny_gold_1m_hourly_overlap_trades.csv
            ny_gold_1m_hourly_overlap_summary.txt
