name: Export Gold Historical Candles
on:
  workflow_dispatch:
    inputs:
      days:
        description: Days to export
        required: true
        default: '180'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Export historical bid ask data
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          DAYS: ${{ inputs.days }}
        run: python export_gold_history.py
      - uses: actions/upload-artifact@v4
        with:
          name: gold-m1-bidask-history
          path: gold_m1_bidask_history.csv
