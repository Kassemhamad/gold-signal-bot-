name: NY Gold Daily Strategy Research
on:
  workflow_dispatch:
    inputs:
      days:
        description: Historical calendar days
        required: true
        default: '180'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Backtest historical daily signals
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          BACKTEST_DAYS: ${{ inputs.days }}
        run: python ny_gold_daily_strategy_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ny-gold-daily-research
          path: |
            ny_gold_daily_strategy_research_ranking.csv
            ny_gold_daily_strategy_research_trades.csv
            ny_gold_daily_strategy_research_summary.txt
